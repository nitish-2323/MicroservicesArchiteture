server:
  port: 8082

spring:
  application:
    name: CustomerService

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bankingapplication
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    registry-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
      instance:
        hostname: localhost
resilience4j:
  circuit breaker:
    instances:
      accountService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s