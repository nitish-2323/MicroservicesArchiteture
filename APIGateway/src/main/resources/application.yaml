server:
  port: 9191

spring:
  application:
    name: APIGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: CustomerService
              uri: lb://CustomerService
              predicates:
                - Path=/customers/**

            - id: AccountService
              uri: lb://AccountService
              predicates:
                - Path=/accounts/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost